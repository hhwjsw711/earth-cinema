<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>任务助手</title>
        <link rel="stylesheet" href="popup.css" />
    </head>
    <body>
        <div class="container">
            <header class="header">
                <div class="logo">
                    <svg
                        class="logo-icon"
                        viewBox="0 0 32 32"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <circle
                            cx="16"
                            cy="16"
                            r="14"
                            stroke="currentColor"
                            stroke-width="2"
                        />
                        <ellipse
                            cx="16"
                            cy="16"
                            rx="14"
                            ry="6"
                            stroke="currentColor"
                            stroke-width="1.5"
                        />
                        <ellipse
                            cx="16"
                            cy="16"
                            rx="6"
                            ry="14"
                            stroke="currentColor"
                            stroke-width="1.5"
                        />
                        <circle cx="16" cy="16" r="3" fill="currentColor" />
                    </svg>
                    <div class="logo-text">
                        <h1>任务助手</h1>
                        <span class="tagline">快速创建任务</span>
                    </div>
                </div>
            </header>

            <main class="main">
                <div class="steps">
                    <div class="step" data-step="1">
                        <span class="step-number">1</span>
                        <span class="step-label">填写</span>
                    </div>
                    <div class="step-line"></div>
                    <div class="step" data-step="2">
                        <span class="step-number">2</span>
                        <span class="step-label">提交</span>
                    </div>
                </div>

                <button class="btn btn-reset hidden" id="reset-btn">
                    <svg
                        class="icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <path
                            d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"
                        />
                        <path d="M3 3v5h5" />
                    </svg>
                    重新开始
                </button>

                <section class="card api-card">
                    <button class="card-header collapsible" id="api-toggle">
                        <div class="card-title">
                            <svg
                                class="icon"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                            >
                                <path
                                    d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"
                                />
                            </svg>
                            <span>API 配置</span>
                        </div>
                        <div class="api-status" id="api-status-badge">
                            <span class="status-dot"></span>
                            <span class="status-text">未配置</span>
                        </div>
                        <svg
                            class="chevron"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <path d="M6 9l6 6 6-6" />
                        </svg>
                    </button>
                    <div class="card-content collapsed" id="api-content">
                        <div class="input-group">
                            <label for="api-key">API 密钥</label>
                            <div class="input-wrapper">
                                <input
                                    type="password"
                                    id="api-key"
                                    placeholder="输入您的 API 密钥"
                                />
                                <button
                                    class="input-action"
                                    id="toggle-visibility"
                                    title="显示/隐藏密钥"
                                >
                                    <svg
                                        class="eye-icon"
                                        viewBox="0 0 24 24"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="2"
                                    >
                                        <path
                                            d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                                        />
                                        <circle cx="12" cy="12" r="3" />
                                    </svg>
                                </button>
                            </div>
                            <p class="input-hint">
                                在 task.isllm.com 获取您的 API 密钥
                            </p>
                            <p class="input-hint">
                                🔒 安全存储在浏览器中，不会共享
                            </p>
                        </div>
                        <button class="btn btn-secondary" id="save-key">
                            <svg
                                class="icon"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                            >
                                <path
                                    d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"
                                />
                                <polyline points="17,21 17,13 7,13 7,21" />
                                <polyline points="7,3 7,8 15,8" />
                            </svg>
                            保存密钥
                        </button>
                    </div>
                </section>

                <!-- 截图功能暂时隐藏
                <section class="card" id="capture-section">
                    <div class="card-header">
                        <div class="card-title">
                            <svg
                                class="icon"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                            >
                                <path
                                    d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"
                                />
                                <circle cx="12" cy="13" r="4" />
                            </svg>
                            <span>截图</span>
                        </div>
                    </div>
                    <div class="card-content">
                        <p class="card-description">
                            打开任意页面，点击下方按钮截取当前画面作为任务截图。
                        </p>
                        <button
                            class="btn btn-primary btn-large"
                            id="capture-btn"
                            disabled
                        >
                            <svg
                                class="icon"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                            >
                                <circle cx="12" cy="12" r="10" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                            截取当前页面
                        </button>
                        <div
                            class="preview-container hidden"
                            id="capture-preview"
                        >
                            <div class="preview-label">已截取</div>
                            <img id="preview-image" alt="截图预览" />
                        </div>
                    </div>
                </section>
                -->

                <section class="card hidden" id="transform-section">
                    <div class="card-header">
                        <div class="card-title">
                            <svg
                                class="icon"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                            >
                                <path
                                    d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
                                />
                                <polyline points="14,2 14,8 20,8" />
                            </svg>
                            <span>填写任务信息</span>
                        </div>
                    </div>
                    <div class="card-content">
                        <div class="input-group">
                            <label for="task-title">任务标题 *</label>
                            <input
                                type="text"
                                id="task-title"
                                placeholder="简要描述任务内容"
                                required
                            />
                        </div>

                        <div class="form-row">
                            <div class="input-group">
                                <label for="task-type">任务类型 *</label>
                                <select id="task-type" required>
                                    <option value="bug_handling" selected>
                                        Bug修复
                                    </option>
                                    <option value="feature_optimization">
                                        功能优化
                                    </option>
                                    <option value="incident_handling">
                                        故障处置
                                    </option>
                                    <option value="server_config">
                                        服务器资源配置
                                    </option>
                                    <option value="permission_config">
                                        配置管理
                                    </option>
                                    <option value="security_risk">
                                        安全风险处理
                                    </option>
                                    <option value="security_config">
                                        安全配置管理
                                    </option>
                                    <option value="third_party_integration">
                                        与其他平台对接
                                    </option>
                                    <option value="consultation">
                                        技术咨询
                                    </option>
                                    <option value="data_maintenance">
                                        数据维护与统计
                                    </option>
                                    <option value="data_migration">
                                        数据迁移
                                    </option>
                                    <option value="emergency_drill">
                                        应急演练
                                    </option>
                                    <option value="documentation">
                                        文档管理
                                    </option>
                                    <option value="data_security">
                                        数据安全
                                    </option>
                                    <option value="password_service_guarantee">
                                        密码服务接口保障
                                    </option>
                                    <option value="security_compliance">
                                        安全合规性保障
                                    </option>
                                    <option value="consultation_assist">
                                        咨询协助
                                    </option>
                                    <option value="routine_inspection">
                                        例行巡检
                                    </option>
                                    <option value="other">其他</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label for="task-status">状态 *</label>
                                <select id="task-status" required>
                                    <option value="todo" selected>
                                        未开始
                                    </option>
                                    <option value="backlog">未排期</option>
                                    <option value="in_progress">进行中</option>
                                    <option value="done">已完成</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="input-group">
                                <label for="sub-platform">所属子平台 *</label>
                                <select id="sub-platform" required>
                                    <option
                                        value="data_catalog_platform"
                                        selected
                                    >
                                        数据目录平台
                                    </option>
                                    <option value="data_report_platform">
                                        数据上报平台
                                    </option>
                                    <option value="data_governance_platform">
                                        数据治理平台
                                    </option>
                                    <option value="town_warehouse">
                                        镇街数仓
                                    </option>
                                    <option value="topic_db">专题库</option>
                                    <option value="platform_wide">
                                        公共数据平台
                                    </option>
                                    <option value="ai_data_service">
                                        AI数据服务
                                    </option>
                                    <option value="datav">DataV</option>
                                    <option value="work_portal">
                                        工作门户
                                    </option>
                                    <option value="core_business_platform">
                                        核心业务平台
                                    </option>
                                    <option value="enterprise_tags">
                                        企业标签
                                    </option>
                                    <option value="staging_db">前置库</option>
                                    <option value="data_sharing_platform">
                                        数据共享平台
                                    </option>
                                    <option value="data_archive_platform">
                                        数据归档平台
                                    </option>
                                    <option value="data_feedback">
                                        数据回流
                                    </option>
                                    <option value="data_exchange_platform">
                                        数据交换平台
                                    </option>
                                    <option value="data_open_platform">
                                        数据开放平台
                                    </option>
                                    <option value="resource_view">
                                        资源视窗
                                    </option>
                                    <option value="authorized_operation">
                                        授权运营
                                    </option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label for="district">所属区县 *</label>
                                <select id="district" required>
                                    <option value="city_level" selected>
                                        市本级
                                    </option>
                                    <option value="development_zone">
                                        开发区
                                    </option>
                                    <option value="liandu">莲都区</option>
                                    <option value="qingtian">青田县</option>
                                    <option value="jinyun">缙云县</option>
                                    <option value="suichang">遂昌县</option>
                                    <option value="songyang">松阳县</option>
                                    <option value="yunhe">云和县</option>
                                    <option value="qingyuan">
                                        庆元县
                                    </option>
                                    <option value="jingning">景宁县</option>
                                    <option value="longquan">龙泉市</option>
                                </select>
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="task-description">任务描述</label>
                            <textarea
                                id="task-description"
                                rows="2"
                                placeholder="详细描述任务内容（可选）"
                            ></textarea>
                        </div>

<button class="btn btn-primary" id="transform-btn">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 2L11 13"/>
                                <path d="M22 2l-7 20-4-9-9-4 20-7z"/>
                            </svg>
                            提交任务
                        </button>
                    </div>
                </section>

                <!-- Success Section - Step 3 -->
                <section class="card hidden" id="success-section">
                    <div class="card-header">
                        <div class="card-title">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                                <polyline points="22,4 12,14.01 9,11.01"/>
                            </svg>
                            <span>提交成功</span>
                        </div>
                    </div>
                    <div class="card-content">
                        <p class="card-description">任务已成功创建并添加到任务看板</p>
                        <button class="btn btn-primary" id="open-board-btn">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                                <polyline points="15,3 21,3 21,9"/>
                                <line x1="10" y1="14" x2="21" y2="3"/>
                            </svg>
                            查看任务看板
                        </button>
                        <button class="btn btn-secondary" id="new-task-btn">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="12" y1="5" x2="12" y2="19"/>
                                <line x1="5" y1="12" x2="19" y2="12"/>
                            </svg>
                            创建新任务
                        </button>
                    </div>
                </section>

                <div class="toast hidden" id="toast">
                    <div class="toast-icon"></div>
                    <div class="toast-content">
                        <span class="toast-title"></span>
                        <span class="toast-message"></span>
                    </div>
                </div>

                <div class="loading-overlay hidden" id="loading">
                    <p class="loading-text" id="loading-text">处理中...</p>
                    <button class="btn btn-cancel" id="cancel-btn">取消</button>
                </div>
            </main>

            <footer class="footer">
                <span>快速创建任务</span>
            </footer>
        </div>

        <script src="popup.js"></script>
    </body>
</html>
